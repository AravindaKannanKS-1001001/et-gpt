[project]
name = "et-mcp"
version = "0.1.0"
description = "EarthTekniks MCP — standalone tool + services (calc/site/catalog). No auth, no frontend, no web."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "mcp>=1.28,<2",
    "fastembed>=0.3",
    "qdrant-client>=1.9",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "psycopg2-binary>=2.9",
    "sqlglot>=25.0",
    "pyyaml>=6.0",
    "anyio>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[project.scripts]
et-mcp = "et_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/et_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
